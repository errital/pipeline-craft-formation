name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'requirements.txt'

  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:

  # ============================================================
  # JOB 1 : LINT
  # ============================================================
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements-dev.txt

      - run: ruff check app/ tests/


  # ============================================================
  # JOB 2 : TESTS SUR PLUSIEURS VERSIONS DE PYTHON
  # ============================================================
  test:
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - run: pip install -r requirements-dev.txt

      # Tests + rapport JUnit + couverture
      - name: Lancer les tests avec rapports qualité
        run: |
          pytest --junitxml=report.xml \
                 --cov=app \
                 --cov-report=term \
                 --cov-report=xml

      # Affichage des résultats dans GitHub
      - name: Publier le résumé des tests
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Résultats Python ${{ matrix.python-version }}
          path: report.xml
          reporter: java-junit

      # Sauvegarde du rapport JUnit
      - name: Sauvegarder le rapport JUnit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-report-python-${{ matrix.python-version }}
          path: report.xml

      # Sauvegarde du rapport de couverture
      - name: Sauvegarder le rapport de couverture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-python-${{ matrix.python-version }}
          path: coverage.xml

      # Exemple d'utilisation d'un secret
      - name: Exemple d'utilisation d'un secret
        env:
          API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: |
          echo "La clé est utilisée mais jamais affichée en clair"


  # ============================================================
  # JOB 3 : BUILD ET PUSH DE L'IMAGE DOCKER
  # ============================================================
  build-and-push:
    runs-on: ubuntu-latest
    needs: test

    # Publication uniquement depuis main
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Connexion à GitHub Container Registry
      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construction et publication de l'image
      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pipeline-craft:${{ github.sha }}