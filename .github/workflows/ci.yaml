name: CI
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
  pull_request:
    branches: [main]

  workflow_dispatch:

  schedule:
    - cron: '0 6 * * 1'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check app/ tests/

  test:
   runs-on: ubuntu-latest
   needs: lint

   steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - run: pip install -r requirements-dev.txt

    # 🧪 Tests + rapport JUnit
    - name: Lancer les tests avec rapport JUnit
      run: pytest --junitxml=report.xml --cov=app --cov-report=term

    # 📊 Publication du rapport dans GitHub
    - name: Publier le résumé des tests
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Résultats des tests
        path: report.xml
        reporter: java-junit

    # 📦 Rapport de couverture
    - name: Sauvegarder le rapport de couverture
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

    - name: Exemple d'utilisation d'un secret
      env:
        API_KEY: ${{ secrets.DEMO_API_KEY }}
      run: |
        echo "La clé est utilisée mais jamais affichée en clair"



  build-and-push:
    runs-on: ubuntu-latest
    needs: test

    # On publie l'image uniquement depuis main
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pipeline-craft:${{ github.sha }}